<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jogo da Velha Web - Universidade de Fortaleza (UNIFOR). Modos 2 Jogadores e Contra o Computador, Partida Única ou Melhor de 3 (MD3).">
  <title>Jogo da Velha - UNIFOR</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos Embutidos (Identidade Visual UNIFOR + Modo Noturno) -->
  <style>
    /* ==========================================================================
       Jogo da Velha Web - Identidade Visual UNIFOR
       Universidade de Fortaleza
       ========================================================================== */

    :root {
      /* Paleta Institucional UNIFOR - Tema Claro */
      --unifor-primary: #003366;        /* Azul Institucional UNIFOR */
      --unifor-primary-dark: #002244;
      --unifor-primary-light: #0056b3;   /* Azul Destaque */
      --unifor-primary-glow: rgba(0, 86, 179, 0.2);
      --unifor-accent: #d97706;         /* Laranja UNIFOR / Jogador O */
      --unifor-accent-light: #f59e0b;
      --unifor-accent-glow: rgba(217, 119, 6, 0.2);
      
      /* Superfícies e Fundos */
      --bg-gradient-start: #f8fafc;
      --bg-gradient-end: #e8eef5;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --section-bg: #f8fafc;
      --cell-bg: #ffffff;
      --cell-hover-bg: #f8fafc;
      --board-bg: #e2e8f0;
      --status-bg: #f1f5f9;
      --select-bg: #ffffff;
      --select-border: #cbd5e1;
      
      /* Cores de Texto e UI */
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      /* Status */
      --success-color: #10b981;
      --tie-color: #6366f1;
      
      /* Sombras e Raios */
      --shadow-sm: 0 1px 3px rgba(0, 51, 102, 0.06), 0 1px 2px rgba(0, 51, 102, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 51, 102, 0.08), 0 2px 4px -2px rgba(0, 51, 102, 0.06);
      --shadow-lg: 0 10px 25px -3px rgba(0, 51, 102, 0.12), 0 4px 6px -4px rgba(0, 51, 102, 0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      
      /* Dimensões */
      --board-size: min(88vw, 360px);
    }

    /* ==========================================================================
       Modo Noturno (Dark Mode)
       ========================================================================== */
    body.dark-mode {
      --bg-gradient-start: #070c18;
      --bg-gradient-end: #0f172a;
      --card-bg: #182234;
      --card-border: #2c3a52;
      --section-bg: #121a29;
      --cell-bg: #1f2c42;
      --cell-hover-bg: #273752;
      --board-bg: #0d1422;
      --status-bg: #121a29;
      --select-bg: #182234;
      --select-border: #3b4d6b;
      
      --unifor-primary: #38bdf8;
      --unifor-primary-dark: #0284c7;
      --unifor-primary-light: #60a5fa;
      --unifor-primary-glow: rgba(56, 189, 248, 0.25);
      
      --unifor-accent: #fbbf24;
      --unifor-accent-light: #fcd34d;
      --unifor-accent-glow: rgba(251, 191, 36, 0.25);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 12px 28px -3px rgba(0, 0, 0, 0.6);
    }

    /* Reset Global & Tipografia */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Canvas de Confetes em Tela Cheia */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    /* Container Principal do Jogo */
    .game-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--card-border);
      padding: 1.75rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(8px);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Cabeçalho Institucional & Linha Superior */
    .game-header {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .institutional-subtitle {
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--unifor-primary-light);
      text-transform: uppercase;
    }

    /* Botão de Modo Noturno */
    .btn-theme-toggle {
      background: var(--section-bg);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius-full);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.25s ease;
      outline: none;
    }

    .btn-theme-toggle:hover {
      color: var(--unifor-primary);
      border-color: var(--unifor-primary-light);
      transform: rotate(15deg) scale(1.05);
      box-shadow: var(--shadow-sm);
    }

    .btn-theme-toggle:active {
      transform: scale(0.92);
    }

    .theme-icon {
      width: 17px;
      height: 17px;
      transition: transform 0.3s ease;
    }

    .sun-icon {
      display: none;
    }

    .moon-icon {
      display: block;
    }

    body.dark-mode .sun-icon {
      display: block;
    }

    body.dark-mode .moon-icon {
      display: none;
    }

    .main-title {
      text-align: center;
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--unifor-primary);
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    /* Seção de Controles (Modo e Formato) */
    .controls-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      background: var(--section-bg);
      padding: 0.85rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .control-group label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .select-wrapper {
      position: relative;
    }

    .custom-select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--text-main);
      background-color: var(--select-bg);
      border: 1.5px solid var(--select-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      appearance: auto;
    }

    .custom-select:hover {
      border-color: var(--unifor-primary-light);
    }

    .custom-select:focus {
      border-color: var(--unifor-primary-light);
      box-shadow: 0 0 0 3px var(--unifor-primary-glow);
    }

    /* Seção de Placar e Rodadas */
    .scoreboard-section {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
    }

    .score-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem 0.5rem;
      border-radius: var(--radius-md);
      background: var(--section-bg);
      border: 1.5px solid var(--card-border);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
      position: relative;
    }

    .score-card.active-turn {
      transform: translateY(-2px);
    }

    .player-x-card.active-turn {
      border-color: var(--unifor-primary-light);
      box-shadow: 0 4px 14px var(--unifor-primary-glow);
    }

    .player-o-card.active-turn {
      border-color: var(--unifor-accent);
      box-shadow: 0 4px 14px var(--unifor-accent-glow);
    }

    .player-symbol-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      margin-bottom: 0.2rem;
    }

    .badge-x {
      background: rgba(0, 51, 102, 0.12);
      color: var(--unifor-primary);
    }

    body.dark-mode .badge-x {
      background: rgba(56, 189, 248, 0.2);
      color: var(--unifor-primary);
    }

    .badge-o {
      background: rgba(217, 119, 6, 0.12);
      color: var(--unifor-accent);
    }

    body.dark-mode .badge-o {
      background: rgba(251, 191, 36, 0.2);
      color: var(--unifor-accent);
    }

    .player-name {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-align: center;
      white-space: nowrap;
    }

    .score-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 0.15rem;
    }

    .player-x-card .score-value {
      color: var(--unifor-primary);
    }

    .player-o-card .score-value {
      color: var(--unifor-accent);
    }

    /* Indicador de Rodada */
    .round-indicator-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0.75rem;
      background: linear-gradient(135deg, var(--unifor-primary-dark, #002244) 0%, #003366 100%);
      color: #ffffff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      min-width: 68px;
    }

    body.dark-mode .round-indicator-card {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    }

    .round-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .round-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
    }

    /* Barra de Status do Turno */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      background: var(--status-bg);
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid var(--card-border);
    }

    .status-indicator-dot {
      width: 9px;
      height: 9px;
      border-radius: var(--radius-full);
      background: var(--unifor-primary-light);
      display: inline-block;
      animation: pulse-dot 1.8s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    /* Tabuleiro do Jogo 3x3 */
    .board-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.25rem 0;
    }

    .board-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      width: var(--board-size);
      height: var(--board-size);
      background: var(--board-bg);
      padding: 10px;
      border-radius: var(--radius-lg);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
      transition: background 0.3s ease;
    }

    /* Células do Tabuleiro */
    .cell {
      background: var(--cell-bg);
      border: none;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
      box-shadow: var(--shadow-sm);
      color: transparent;
      user-select: none;
      outline: none;
    }

    .cell:hover:not(:disabled):not(.filled) {
      background: var(--cell-hover-bg);
      transform: scale(1.02);
      box-shadow: var(--shadow-md);
    }

    .cell:active:not(:disabled):not(.filled) {
      transform: scale(0.96);
    }

    .cell:focus-visible {
      outline: 3px solid var(--unifor-primary-light);
      outline-offset: 2px;
    }

    .cell:disabled, .cell.filled {
      cursor: default;
    }

    /* Estilização dos Símbolos X e O */
    .cell.cell-x {
      color: var(--unifor-primary);
      text-shadow: 0 2px 6px var(--unifor-primary-glow);
      animation: mark-pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cell.cell-o {
      color: var(--unifor-accent);
      text-shadow: 0 2px 6px var(--unifor-accent-glow);
      animation: mark-pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes mark-pop {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }
      70% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Linha de Vitória (Overlay) */
    .winning-line {
      position: absolute;
      background: linear-gradient(90deg, #10b981, #059669);
      border-radius: var(--radius-full);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.7);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transform-origin: 0% 50%;
      transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .winning-line.active {
      opacity: 1;
    }

    /* Rodapé / Botão de Reinício */
    .game-footer {
      display: flex;
      justify-content: center;
    }

    .btn-restart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(135deg, var(--unifor-primary-dark, #002244) 0%, #0056b3 100%);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 4px 12px var(--unifor-primary-glow);
      transition: all 0.2s ease;
      outline: none;
    }

    body.dark-mode .btn-restart {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    }

    .btn-restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--unifor-primary-glow);
      filter: brightness(1.06);
    }

    .btn-restart:active {
      transform: translateY(0);
    }

    .btn-restart:focus-visible {
      outline: 3px solid var(--unifor-primary-light);
      outline-offset: 3px;
    }

    .restart-icon {
      width: 18px;
      height: 18px;
      transition: transform 0.4s ease;
    }

    .btn-restart:hover .restart-icon {
      transform: rotate(-180deg);
    }

    /* Responsividade Mobile */
    @media (max-width: 400px) {
      .game-container {
        padding: 1.25rem 1rem;
        gap: 1rem;
      }

      .main-title {
        font-size: 1.55rem;
      }

      .cell {
        font-size: 2.1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Canvas de Confetes para Efeito de Vitória -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="game-container" id="game-app">
    <!-- Cabeçalho Institucional com Botão de Modo Noturno -->
    <header class="game-header">
      <div class="header-top-row">
        <span class="institutional-subtitle" id="institutional-subtitle">UNIVERSIDADE DE FORTALEZA</span>
        <button type="button" class="btn-theme-toggle" id="theme-toggle-btn" aria-label="Alternar modo claro e escuro" title="Alternar tema">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
      <h1 class="main-title" id="main-title">JOGO DA VELHA</h1>
    </header>

    <!-- Controles de Configuração da Partida -->
    <section class="controls-section" aria-label="Configurações da Partida">
      <div class="control-group">
        <label for="mode-select">Modo de Jogo</label>
        <div class="select-wrapper">
          <select id="mode-select" class="custom-select" aria-label="Selecione o modo de jogo">
            <option value="pvp">2 Jogadores (PVP)</option>
            <option value="cpu">Contra o Computador</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label for="format-select">Formato da Partida</label>
        <div class="select-wrapper">
          <select id="format-select" class="custom-select" aria-label="Selecione o formato da disputa">
            <option value="single">Partida Única</option>
            <option value="bo3">Melhor de 3 (MD3)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Painel de Placar e Rodadas -->
    <section class="scoreboard-section" aria-label="Placar e Rodadas">
      <!-- Card Jogador X -->
      <div class="score-card player-x-card" id="card-player-x">
        <span class="player-symbol-badge badge-x">X</span>
        <span class="player-name" id="player-x-label">JOGADOR X</span>
        <span class="score-value" id="score-x">0</span>
      </div>

      <!-- Indicador de Rodada -->
      <div class="round-indicator-card" id="card-round">
        <span class="round-title">RODADA</span>
        <span class="round-value" id="round-display">1/1</span>
      </div>

      <!-- Card Jogador O / CPU -->
      <div class="score-card player-o-card" id="card-player-o">
        <span class="player-symbol-badge badge-o">O</span>
        <span class="player-name" id="player-o-label">JOGADOR O</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </section>

    <!-- Mensagem de Status / Turno -->
    <div class="status-bar" id="status-bar" role="status" aria-live="polite">
      <span class="status-indicator-dot" id="status-dot"></span>
      <span class="status-message" id="status-message">Vez do Jogador X</span>
    </div>

    <!-- Tabuleiro do Jogo 3x3 -->
    <section class="board-wrapper" aria-label="Tabuleiro do Jogo da Velha">
      <div class="board-grid" id="board-grid" role="grid" aria-label="Matriz do Jogo da Velha 3 por 3">
        <!-- Linha de Vitória (Overlay) -->
        <div class="winning-line" id="winning-line" aria-hidden="true"></div>

        <!-- 9 Células do Tabuleiro -->
        <button type="button" class="cell" id="cell-0" data-index="0" aria-label="Célula 1, linha 1, coluna 1"></button>
        <button type="button" class="cell" id="cell-1" data-index="1" aria-label="Célula 2, linha 1, coluna 2"></button>
        <button type="button" class="cell" id="cell-2" data-index="2" aria-label="Célula 3, linha 1, coluna 3"></button>
        <button type="button" class="cell" id="cell-3" data-index="3" aria-label="Célula 4, linha 2, coluna 1"></button>
        <button type="button" class="cell" id="cell-4" data-index="4" aria-label="Célula 5, linha 2, coluna 2"></button>
        <button type="button" class="cell" id="cell-5" data-index="5" aria-label="Célula 6, linha 2, coluna 3"></button>
        <button type="button" class="cell" id="cell-6" data-index="6" aria-label="Célula 7, linha 3, coluna 1"></button>
        <button type="button" class="cell" id="cell-7" data-index="7" aria-label="Célula 8, linha 3, coluna 2"></button>
        <button type="button" class="cell" id="cell-8" data-index="8" aria-label="Célula 9, linha 3, coluna 3"></button>
      </div>
    </section>

    <!-- Botão de Reinício Geral -->
    <footer class="game-footer">
      <button type="button" class="btn-restart" id="restart-btn" aria-label="Reiniciar o jogo da velha">
        <svg class="restart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>REINICIAR JOGO</span>
      </button>
    </footer>
  </main>

  <!-- Lógica Completa Embutida (Web Audio API, IA, Séries MD3, Confetes, Tema) -->
  <script>
    (() => {
      'use strict';

      /* ==========================================================================
         1. Dicionário de Dados & Estado do Jogo (CDU - Seção 18)
         ========================================================================== */
      const gameState = {
        options: ['', '', '', '', '', '', '', '', ''], // Estado das 9 células
        currentPlayer: 'X',                            // 'X' ou 'O'
        running: true,                                 // Flag de jogo ativo
        winsX: 0,                                      // Vitórias Jogador X
        winsO: 0,                                      // Vitórias Jogador O / CPU
        currentRound: 1,                               // Rodada atual
        mode: 'pvp',                                   // 'pvp' ou 'cpu'
        format: 'single',                              // 'single' ou 'bo3'
        isProcessingCPU: false                         // Bloqueio de cliques durante vez da CPU
      };

      /* Padrões de Vitória (Linhas, Colunas e Diagonais) */
      const WIN_PATTERNS = [
        [0, 1, 2], // Linha 1
        [3, 4, 5], // Linha 2
        [6, 7, 8], // Linha 3
        [0, 3, 6], // Coluna 1
        [1, 4, 7], // Coluna 2
        [2, 5, 8], // Coluna 3
        [0, 4, 8], // Diagonal Principal
        [2, 4, 6]  // Diagonal Secundária
      ];

      /* ==========================================================================
         2. Mapeamento de Elementos do DOM (UI-01 a UI-11 + Tema)
         ========================================================================== */
      const elements = {
        modeSelect: document.getElementById('mode-select'),
        formatSelect: document.getElementById('format-select'),
        scoreX: document.getElementById('score-x'),
        scoreO: document.getElementById('score-o'),
        roundDisplay: document.getElementById('round-display'),
        playerOLabel: document.getElementById('player-o-label'),
        cardPlayerX: document.getElementById('card-player-x'),
        cardPlayerO: document.getElementById('card-player-o'),
        statusMessage: document.getElementById('status-message'),
        statusDot: document.getElementById('status-dot'),
        boardGrid: document.getElementById('board-grid'),
        winningLine: document.getElementById('winning-line'),
        restartBtn: document.getElementById('restart-btn'),
        cells: Array.from(document.querySelectorAll('.cell')),
        confettiCanvas: document.getElementById('confetti-canvas'),
        themeToggleBtn: document.getElementById('theme-toggle-btn')
      };

      /* ==========================================================================
         3. Módulo de Áudio Sintetizado (Web Audio API - Zero Dependências)
         ========================================================================== */
      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      /**
       * Toca uma frequência com decaimento suave
       */
      function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);

          gain.gain.setValueAtTime(gainVal, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {
          console.warn('Web Audio API não inicializada:', e);
        }
      }

      const soundEffects = {
        moveX: () => playTone(520, 'sine', 0.12, 0.12),
        moveO: () => playTone(380, 'sine', 0.12, 0.12),
        themeToggle: () => playTone(620, 'sine', 0.08, 0.06),
        tie: () => {
          // Tom descendente
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          } catch (e) {}
        },
        win: () => {
          // Acorde triunfal em arpeggio
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((note, index) => {
            setTimeout(() => {
              playTone(note, 'triangle', 0.3, 0.12);
            }, index * 90);
          });
        }
      };

      /* ==========================================================================
         4. Módulo de Efeitos Visuais (Confetes & Linha de Vitória)
         ========================================================================== */
      let confettiParticles = [];
      let confettiAnimationId = null;

      function triggerConfetti() {
        const canvas = elements.confettiCanvas;
        if (!canvas) return;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        confettiParticles = [];
        const colors = ['#003366', '#0056b3', '#38bdf8', '#d97706', '#f59e0b', '#fbbf24', '#10b981'];

        for (let i = 0; i < 90; i++) {
          confettiParticles.push({
            x: canvas.width * 0.5 + (Math.random() - 0.5) * 120,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 14,
            vy: Math.random() * -12 - 5,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 10,
            gravity: 0.35,
            drag: 0.98,
            opacity: 1
          });
        }

        if (confettiAnimationId) {
          cancelAnimationFrame(confettiAnimationId);
        }

        function render() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;

          confettiParticles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= p.drag;
            p.vy *= p.drag;
            p.rotation += p.rotSpeed;
            p.opacity -= 0.009;

            if (p.opacity > 0 && p.y < canvas.height + 20) {
              alive = true;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate((p.rotation * Math.PI) / 180);
              ctx.globalAlpha = Math.max(0, p.opacity);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
              ctx.restore();
            }
          });

          if (alive) {
            confettiAnimationId = requestAnimationFrame(render);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiAnimationId = null;
          }
        }

        render();
      }

      /**
       * Traça a linha visual contínua sobre as 3 células vitoriosas (UI-10)
       */
      function drawWinningLine(pattern) {
        const firstCell = elements.cells[pattern[0]];
        const lastCell = elements.cells[pattern[2]];
        const gridRect = elements.boardGrid.getBoundingClientRect();
        const firstRect = firstCell.getBoundingClientRect();
        const lastRect = lastCell.getBoundingClientRect();

        // Centro da primeira e última célula relativo ao grid
        const x1 = (firstRect.left + firstRect.width / 2) - gridRect.left;
        const y1 = (firstRect.top + firstRect.height / 2) - gridRect.top;
        const x2 = (lastRect.left + lastRect.width / 2) - gridRect.left;
        const y2 = (lastRect.top + lastRect.height / 2) - gridRect.top;

        const length = Math.hypot(x2 - x1, y2 - y1) + 24; // Leve extensão para visual elegante
        const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);

        // Ajuste de início recuado
        const offset = 12;
        const rad = (angle * Math.PI) / 180;
        const startX = x1 - Math.cos(rad) * offset;
        const startY = y1 - Math.sin(rad) * offset;

        const line = elements.winningLine;
        line.style.width = `${length}px`;
        line.style.height = '6px';
        line.style.left = `${startX}px`;
        line.style.top = `${startY}px`;
        line.style.transform = `rotate(${angle}deg)`;
        line.classList.add('active');
      }

      function hideWinningLine() {
        elements.winningLine.classList.remove('active');
        elements.winningLine.style.width = '0px';
      }

      /* ==========================================================================
         5. Lógica de Turnos, Verificação de Vitória e CPU
         ========================================================================== */

      function updateStatusUI(message, dotColor = null) {
        elements.statusMessage.textContent = message;
        if (dotColor) {
          elements.statusDot.style.background = dotColor;
        } else {
          elements.statusDot.style.background = gameState.currentPlayer === 'X' 
            ? 'var(--unifor-primary-light)' 
            : 'var(--unifor-accent)';
        }

        // Atualiza destaque no card do jogador da vez
        if (gameState.running) {
          if (gameState.currentPlayer === 'X') {
            elements.cardPlayerX.classList.add('active-turn');
            elements.cardPlayerO.classList.remove('active-turn');
          } else {
            elements.cardPlayerO.classList.add('active-turn');
            elements.cardPlayerX.classList.remove('active-turn');
          }
        } else {
          elements.cardPlayerX.classList.remove('active-turn');
          elements.cardPlayerO.classList.remove('active-turn');
        }
      }

      function checkWinner() {
        for (const pattern of WIN_PATTERNS) {
          const [a, b, c] = pattern;
          if (
            gameState.options[a] &&
            gameState.options[a] === gameState.options[b] &&
            gameState.options[a] === gameState.options[c]
          ) {
            return { winner: gameState.options[a], pattern };
          }
        }

        if (!gameState.options.includes('')) {
          return { winner: 'tie', pattern: null };
        }

        return null;
      }

      function handleCellClick(e) {
        const cell = e.target;
        const index = parseInt(cell.getAttribute('data-index'), 10);

        if (!gameState.running || gameState.options[index] !== '' || gameState.isProcessingCPU) {
          return;
        }

        executeMove(index);
      }

      function executeMove(index) {
        // Registra no estado lógico
        gameState.options[index] = gameState.currentPlayer;

        // Atualiza visual da célula
        const cell = elements.cells[index];
        cell.textContent = gameState.currentPlayer;
        cell.classList.add('filled', gameState.currentPlayer === 'X' ? 'cell-x' : 'cell-o');
        cell.disabled = true;

        // Toca som do movimento
        if (gameState.currentPlayer === 'X') {
          soundEffects.moveX();
        } else {
          soundEffects.moveO();
        }

        // Avalia resultado
        const result = checkWinner();

        if (result) {
          handleRoundEnd(result);
        } else {
          // Alterna turno
          gameState.currentPlayer = gameState.currentPlayer === 'X' ? 'O' : 'X';
          const playerLabel = gameState.currentPlayer === 'X' 
            ? 'Jogador X' 
            : (gameState.mode === 'cpu' ? 'Computador' : 'Jogador O');
          
          updateStatusUI(`Vez do ${playerLabel}`);

          // Se for vez da CPU no modo contra robô
          if (gameState.mode === 'cpu' && gameState.currentPlayer === 'O' && gameState.running) {
            handleCPUTurn();
          }
        }
      }

      function handleCPUTurn() {
        gameState.isProcessingCPU = true;
        updateStatusUI('Computador pensando...', 'var(--unifor-accent)');

        // Intervalo de reflexão de 400ms conforme especificado no CDU A2.3
        setTimeout(() => {
          if (!gameState.running) {
            gameState.isProcessingCPU = false;
            return;
          }

          // Escolhe movimento
          const availableIndices = gameState.options
            .map((val, idx) => (val === '' ? idx : null))
            .filter(val => val !== null);

          if (availableIndices.length > 0) {
            // IA Simples / Estratégica
            const chosenIndex = chooseCPUMove(availableIndices);
            gameState.isProcessingCPU = false;
            executeMove(chosenIndex);
          } else {
            gameState.isProcessingCPU = false;
          }
        }, 400);
      }

      /**
       * Escolha inteligente da CPU:
       * 1. Ganhar se houver chance imediata
       * 2. Bloquear o Jogador X se estiver prestes a vencer
       * 3. Pegar o centro (célula 4) se disponível
       * 4. Movimento aleatório entre as opções restantes
       */
      function chooseCPUMove(available) {
        // 1. Tentar vencer
        for (const idx of available) {
          gameState.options[idx] = 'O';
          if (checkWinner()?.winner === 'O') {
            gameState.options[idx] = '';
            return idx;
          }
          gameState.options[idx] = '';
        }

        // 2. Bloquear X
        for (const idx of available) {
          gameState.options[idx] = 'X';
          if (checkWinner()?.winner === 'X') {
            gameState.options[idx] = '';
            return idx;
          }
          gameState.options[idx] = '';
        }

        // 3. Pegar Centro
        if (available.includes(4)) return 4;

        // 4. Aleatório
        const randomIdx = Math.floor(Math.random() * available.length);
        return available[randomIdx];
      }

      function handleRoundEnd(result) {
        gameState.running = false;

        if (result.winner === 'tie') {
          soundEffects.tie();
          updateStatusUI('Rodada Empatada!', 'var(--tie-color)');

          // Trata MD3 em caso de empate (CDU E1.4)
          if (gameState.format === 'bo3' && gameState.currentRound <= 3) {
            setTimeout(() => {
              resetBoardForNextRound(false); // Não incrementa rodada em empate
            }, 2000);
          }
          return;
        }

        // Vitória de X ou O
        const winnerSymbol = result.winner;
        drawWinningLine(result.pattern);
        triggerConfetti();
        soundEffects.win();

        if (winnerSymbol === 'X') {
          gameState.winsX++;
          elements.scoreX.textContent = gameState.winsX;
        } else {
          gameState.winsO++;
          elements.scoreO.textContent = gameState.winsO;
        }

        const winnerName = winnerSymbol === 'X' 
          ? 'Jogador X' 
          : (gameState.mode === 'cpu' ? 'Computador' : 'Jogador O');

        // Regra do Formato MD3 (CDU A1.7)
        if (gameState.format === 'bo3') {
          if (gameState.winsX === 2 || gameState.winsO === 2) {
            updateStatusUI(`🏆 ${winnerName} é o Campeão da Partida!`, 'var(--success-color)');
          } else if (gameState.currentRound < 3) {
            updateStatusUI(`Vitória de ${winnerName}! Próxima rodada em 2s...`, 'var(--success-color)');
            setTimeout(() => {
              gameState.currentRound++;
              updateRoundDisplay();
              resetBoardForNextRound(true);
            }, 2000);
          } else {
            // Fim da 3ª rodada
            if (gameState.winsX > gameState.winsO) {
              updateStatusUI(`🏆 Jogador X é o Campeão!`, 'var(--success-color)');
            } else if (gameState.winsO > gameState.winsX) {
              const name = gameState.mode === 'cpu' ? 'Computador' : 'Jogador O';
              updateStatusUI(`🏆 ${name} é o Campeão!`, 'var(--success-color)');
            } else {
              updateStatusUI(`Série MD3 terminou empatada!`, 'var(--tie-color)');
            }
          }
        } else {
          // Partida Única (CDU A1.8)
          updateStatusUI(`🎉 Vitória de ${winnerName}!`, 'var(--success-color)');
        }
      }

      function resetBoardForNextRound(advanceRound = true) {
        gameState.options = ['', '', '', '', '', '', '', '', ''];
        gameState.currentPlayer = 'X';
        gameState.running = true;
        gameState.isProcessingCPU = false;

        hideWinningLine();

        elements.cells.forEach(cell => {
          cell.textContent = '';
          cell.className = 'cell';
          cell.disabled = false;
        });

        updateStatusUI('Vez do Jogador X');
      }

      function resetFullGame() {
        gameState.options = ['', '', '', '', '', '', '', '', ''];
        gameState.currentPlayer = 'X';
        gameState.running = true;
        gameState.winsX = 0;
        gameState.winsO = 0;
        gameState.currentRound = 1;
        gameState.isProcessingCPU = false;

        elements.scoreX.textContent = '0';
        elements.scoreO.textContent = '0';
        updateRoundDisplay();
        hideWinningLine();

        elements.cells.forEach(cell => {
          cell.textContent = '';
          cell.className = 'cell';
          cell.disabled = false;
        });

        updateStatusUI('Vez do Jogador X');
      }

      function updateRoundDisplay() {
        if (gameState.format === 'bo3') {
          elements.roundDisplay.textContent = `${gameState.currentRound}/3`;
        } else {
          elements.roundDisplay.textContent = '1/1';
        }
      }

      /* ==========================================================================
         6. Modo Noturno / Gerenciamento de Tema
         ========================================================================== */
      function initTheme() {
        const savedTheme = localStorage.getItem('unifor_ttt_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
      }

      function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('unifor_ttt_theme', isDark ? 'dark' : 'light');
        soundEffects.themeToggle();
      }

      /* ==========================================================================
         7. Eventos e Inicialização
         ========================================================================== */

      // Seletor de Modo (PVP vs CPU)
      elements.modeSelect.addEventListener('change', (e) => {
        gameState.mode = e.target.value;
        elements.playerOLabel.textContent = gameState.mode === 'cpu' ? 'COMPUTADOR' : 'JOGADOR O';
        resetFullGame();
      });

      // Seletor de Formato (Única vs MD3)
      elements.formatSelect.addEventListener('change', (e) => {
        gameState.format = e.target.value;
        resetFullGame();
      });

      // Cliques no Tabuleiro
      elements.cells.forEach(cell => {
        cell.addEventListener('click', handleCellClick);
      });

      // Botão Reiniciar
      elements.restartBtn.addEventListener('click', () => {
        resetFullGame();
      });

      // Botão de Tema (Modo Noturno)
      if (elements.themeToggleBtn) {
        elements.themeToggleBtn.addEventListener('click', toggleTheme);
      }

      // Redimensionamento de janela (recálculo de linha e canvas de confetes)
      window.addEventListener('resize', () => {
        if (elements.confettiCanvas) {
          elements.confettiCanvas.width = window.innerWidth;
          elements.confettiCanvas.height = window.innerHeight;
        }
      });

      // Inicialização
      initTheme();
      updateRoundDisplay();
      updateStatusUI('Vez do Jogador X');

    })();
  </script>
</body>
